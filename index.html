<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clay & Kef</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="env.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      min-height: 100vh;
      background: #faf7f4;
      font-family: 'Inter', sans-serif;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 72px;
      min-height: 100vh;
      background: #9C1A4D;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0 20px;
      flex-shrink: 0;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 50;
    }

    #logo {
      width: 52px;
      height: 52px;
      overflow: hidden;
      display: block;
      margin: 0 auto 20px;
      flex-shrink: 0;
      text-decoration: none;
    }

    #logo img {
      height: 52px;
      width: auto;
      display: block;
      opacity: 0.92;
      filter: brightness(0) invert(1);
    }

    #sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 100%;
      padding: 0 4px;
    }

    .nav-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 58px;
      border-radius: 10px;
      margin: 0 auto;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.32);
      transition: background 0.15s ease, color 0.15s ease;
      gap: 4px;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .nav-label {
      font-size: 12px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.01em;
      line-height: 1;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.9);
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
    }

    .nav-active-bar {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 2px;
      height: 24px;
      background: #fff;
      border-radius: 0 2px 2px 0;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .nav-item.active .nav-active-bar {
      opacity: 1;
    }

    /* ── Main content ── */
    #content {
      flex: 1;
      margin-left: 72px;
      min-height: 100vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <aside id="sidebar">

    <!-- Logo -->
    <a href="#/dashboard" id="logo" title="Clay & Kef">
      <img src="useful_images/logo.png" alt="Clay & Kef" />
    </a>

    <nav>

      <!-- Dashboard -->
      <a href="#/dashboard" data-route="/dashboard" class="nav-item">
        <div class="nav-active-bar"></div>
        <svg viewBox="0 0 24 24">
          <rect width="7" height="9" x="3" y="3" rx="1"/>
          <rect width="7" height="5" x="14" y="3" rx="1"/>
          <rect width="7" height="9" x="14" y="12" rx="1"/>
          <rect width="7" height="5" x="3" y="16" rx="1"/>
        </svg>
        <span class="nav-label">Dash</span>
      </a>

      <!-- Orders -->
      <a href="#/orders" data-route="/orders" class="nav-item">
        <div class="nav-active-bar"></div>
        <svg viewBox="0 0 24 24">
          <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/>
          <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/>
          <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>
        </svg>
        <span class="nav-label">Orders</span>
      </a>

      <!-- Stock -->
      <a href="#/stock" data-route="/stock" class="nav-item">
        <div class="nav-active-bar"></div>
        <svg viewBox="0 0 24 24">
          <rect width="20" height="5" x="2" y="3" rx="1"/>
          <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/>
          <path d="M10 12h4"/>
        </svg>
        <span class="nav-label">Stock</span>
      </a>

      <!-- Customers -->
      <a href="#/customers" data-route="/customers" class="nav-item">
        <div class="nav-active-bar"></div>
        <svg viewBox="0 0 24 24">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="nav-label">Customers</span>
      </a>

      <!-- Export -->
      <a href="#/export" data-route="/export" class="nav-item">
        <div class="nav-active-bar"></div>
        <svg viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span class="nav-label">Export</span>
      </a>

      <!-- Logs -->
      <a href="#/logs" data-route="/logs" class="nav-item">
        <div class="nav-active-bar"></div>
        <svg viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="8" y1="13" x2="16" y2="13"/>
          <line x1="8" y1="17" x2="13" y2="17"/>
        </svg>
        <span class="nav-label">Logs</span>
      </a>

      <!-- Settings -->
      <a href="#/settings" data-route="/settings" class="nav-item">
        <div class="nav-active-bar"></div>
        <svg viewBox="0 0 24 24">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span class="nav-label">Settings</span>
      </a>

    </nav>
  </aside>

  <main id="content"></main>

  <script type="module" src="app.js"></script>
</body>
</html>
